name: Device grant verification

on:
  push:
    branches:
      - codex/ci-device-resource-binding

permissions:
  contents: read

concurrency:
  group: device-grant-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"
  GOMAXPROCS: "2"

jobs:
  format:
    name: Changed Go files formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofumpt
        run: |
          files="controllers/auth.go controllers/token.go controllers/device_auth_test.go object/device_auth_store.go object/device_auth_store_test.go object/token_oauth.go object/token_oauth_util.go object/token_device_test.go"
          unformatted=$(go run mvdan.cc/gofumpt@v0.12.0 -l $files)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            go run mvdan.cc/gofumpt@v0.12.0 -d $files
            exit 1
          fi
  tests:
    name: Go tests, Redis and race detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: casdoor
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      CASDOOR_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - name: Device grant regressions with race detection
        run: go test -race -p 2 ./object ./controllers -run TestDeviceAuthorization -count=1 -v
      - name: Upstream Go test suite
        run: go test -p 2 -v $(go list ./...) -tags skipCi
      - name: Upstream backend race build
        run: go build -p 2 -race -ldflags "-extldflags '-static'"
